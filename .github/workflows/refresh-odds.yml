name: Refresh live odds

# Pulls the latest NFL odds every 2 hours (12x/day) and commits the snapshot so
# the deployed Streamlit app shows fresh games. The app itself never calls the API
# (no per-visitor calls) — only this scheduled job does. NOTE on quota: each pull
# requests 3 markets (h2h, spreads, totals) x 1 region, ~3 credits, so 12x/day is
# ~1,080 credits/month — above The Odds API free 500/month tier. If you hit the cap
# the pulls just fail (site keeps the last snapshot) until the monthly reset; lower
# the frequency or use a paid plan to avoid it. Requires the repo secret ODDS_API_KEY.

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (12x/day) at :00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync runtime deps
        run: uv sync --frozen --no-dev

      - name: Pull latest odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python -c "from ingestion.live_odds import fetch_odds; fetch_odds(); print('odds snapshot refreshed')"

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/odds_api_latest.json
          if git diff --staged --quiet; then
            echo "No odds change — nothing to commit."
          else
            git commit -m "chore: refresh live odds snapshot [skip ci]"
            git push
          fi
