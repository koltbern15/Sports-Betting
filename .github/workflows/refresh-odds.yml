name: Refresh live odds

# Pulls the latest NFL odds every 6 hours (4x/day) and commits the snapshot so the
# deployed Streamlit app shows fresh games. The app itself never calls the API (no
# per-visitor calls) — only this scheduled job does. Quota: each pull requests 3
# markets (h2h, spreads, totals) x 1 region (~3 credits), so 4x/day is ~360
# credits/month — comfortably within The Odds API free 500/month tier. Requires the
# repo secret ODDS_API_KEY.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (4x/day): 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync runtime deps
        run: uv sync --frozen --no-dev

      - name: Pull latest odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python -c "from ingestion.live_odds import fetch_odds; fetch_odds(); print('odds snapshot refreshed')"

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/odds_api_latest.json
          if git diff --staged --quiet; then
            echo "No odds change — nothing to commit."
          else
            git commit -m "chore: refresh live odds snapshot [skip ci]"
            git push
          fi
