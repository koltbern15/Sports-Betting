[project]
name = "nfl-betting-analytics"
version = "0.1.0"
description = "NFL historical betting analytics engine (Slice 1: ingestion + ATS)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",  # transitive floor for the pandas/scipy stack; not imported directly
    "scipy>=1.13",
    "tabulate>=0.9",
    "nfl-data-py>=0.3.2",
    "openpyxl>=3.1.5",
    "lxml>=6.1.1",
    "streamlit>=1.58.0",
    "altair>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The board artifact embeds a long HTML/CSS/JS template string; those lines are
# intentionally over the 100-col limit and not real Python to wrap.
"scripts/build_board_artifact.py" = ["E501"]
